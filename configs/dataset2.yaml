# Configuration for the short-form benchmark dataset ("dataset2").
#
# Verifier-evaluation project phase: this project no longer targets
# long-form generation (see src/dataset/instruction_builder.py's
# `long_form` parameter and validators.py's MIN_WORDS_FOR_LONG_FORM). This
# config selects the short-form difficulty targets and writes to a separate
# `dataset2/` output tree so the original long-form benchmark at
# data/benchmark/benchmark_v1.jsonl (built from configs/dataset_v1.yaml) is
# never touched or overwritten.
#
# This dataset is for test-time / inference-time evaluation only. It is not
# used for model training, and no train/validation/test splits are produced
# (see build_dataset.py).
#
# Run with:
#   python -m src.dataset.build_dataset --config configs/dataset2.yaml --output-dir dataset2 --seed 42

benchmark_version: v2
target_total: 120
seed: 42

# Selects _DIFFICULTY_TARGETS_SHORT_FORM / _DIFFICULTY_BODY_COUNT_SHORT_FORM
# in instruction_builder.py, and drops the explicit word-/page-count
# sentence from natural_language_instruction.
long_form: false

# validators.py's rule 15 ("not_vague") and the long_form_suitability quality
# score both compare target_length.min_words against this. Short-form basic
# items target 250 words (see _DIFFICULTY_TARGETS_SHORT_FORM), so this must
# sit below that with margin.
long_form_word_threshold: 200

# Same offline/deterministic manual-seed bank as dataset_v1.yaml -- only the
# length contract differs.
network_sources_enabled: false

domains:
  mathematics:
    count: 30
    enabled_sources:
      - manual_seed
      - openstax
      - arxiv_metadata

  statistics_ml:
    count: 30
    enabled_sources:
      - manual_seed
      - openstax
      - arxiv_metadata

  scientific_engineering:
    count: 30
    enabled_sources:
      - manual_seed
      - nasa_metadata
      - arxiv_metadata

  financial_economic:
    count: 30
    enabled_sources:
      - manual_seed
      - sec_metadata
      - fred_metadata
      - world_bank_metadata

difficulty_distribution:
  basic: 0.3333
  intermediate: 0.3333
  advanced: 0.3334

quality_thresholds:
  specificity: 0.8
  evaluability: 0.85
  latex_relevance: 0.8
  # No longer a meaningful dimension for a deliberately short-form dataset
  # (its formula rewards >=4 required_sections, which short-form basic items
  # don't have by design) -- neutralized rather than rejecting valid items.
  long_form_suitability: 0.0
  constraint_clarity: 0.85
  source_safety: 1.0

# Debug-only subset for smoke-testing consumers of the dataset. Never a
# training split.
dev_debug_size: 12

# HTTP behavior for source_adapters/base.py when network_sources_enabled is true.
http:
  timeout_seconds: 15
  max_retries: 4
  backoff_seconds: 1.0
  cache_dir: dataset2/raw_sources
  user_agent: "docgen-benchmark-builder/1.0 (+internal research use)"

output:
  benchmark_dirname: benchmark
  seeds_dirname: normalized_seeds
  metadata_dirname: metadata
  raw_sources_dirname: raw_sources
